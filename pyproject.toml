[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-glaucoma-detection"
version = "0.1.0"
description = "Experimental, browser-oriented glaucoma classification research scaffold"
requires-python = ">=3.10,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
